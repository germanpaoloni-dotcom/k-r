services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kor
      POSTGRES_PASSWORD: kor
      POSTGRES_DB: kor_dev
    ports:
      - "5432:5432"
    volumes:
      - kor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  kor_pg_data:
